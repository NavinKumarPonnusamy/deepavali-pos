<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashier · Booth POS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <strong>Booth POS · Cashier</strong>
    <span class="topbar-right">
      <span id="who" class="muted"></span>
      <button id="logoutBtn" class="btn ghost small" type="button">Sign out</button>
    </span>
  </header>

  <!-- Login form is injected here by auth-gate.js -->
  <div id="login"></div>

  <main id="app" class="cashier" hidden>

    <!-- 1. MENU: one card per active item, one button per size -->
    <section class="panel menu-panel">
      <h2>Menu</h2>
      <div id="menuGrid" class="menu-grid"></div>
    </section>

    <!-- 2. CURRENT ORDER -->
    <section class="panel order-panel">
      <h2>Order <span id="nextNo" class="order-no"></span></h2>

      <label class="field">Customer name (optional)
        <input id="custName" maxlength="20" autocomplete="off">
      </label>

      <ul id="cartList" class="cart"></ul>

      <div class="total-row">
        <span>Total</span>
        <strong id="cartTotal">RM0.00</strong>
      </div>

      <div class="pay-toggle" role="group" aria-label="Payment method">
        <button class="btn pay active" data-pay="cash" type="button">Cash</button>
        <button class="btn pay" data-pay="qr" type="button">QR</button>
        <button class="btn pay" data-pay="free" type="button">Free</button>
      </div>

      <div id="cashBox" class="pay-box">
        <label class="field">Cash received
          <input id="received" type="number" inputmode="decimal" min="0" step="0.5">
        </label>
        <div class="quick-cash">
          <button class="btn small" data-cash="5" type="button">RM5</button>
          <button class="btn small" data-cash="10" type="button">RM10</button>
          <button class="btn small" data-cash="20" type="button">RM20</button>
          <button class="btn small" data-cash="50" type="button">RM50</button>
        </div>
        <p>Change: <strong id="change">–</strong></p>
      </div>

      <div id="qrBox" class="pay-box note" hidden>
        <img src="QR.jpeg" alt="DuitNow QR code" class="qr-img">
        <p class="qr-amount">Pay exactly: <strong id="qrAmount"></strong></p>
        Check the DuitNow notification on <b>our</b> phone before handing anything over.
        Don't accept a screenshot on the customer's phone.
      </div>

      <div id="freeBox" class="pay-box" hidden>
        <label class="field">Reason
          <select id="freeReason">
            <option>Committee allowance</option>
            <option>Staff drink</option>
            <option>Remake / spilt</option>
            <option>Other</option>
          </select>
        </label>
      </div>

      <button id="chargeBtn" class="btn primary big" type="button" disabled>Charge</button>
      <button id="clearBtn" class="btn ghost" type="button">Clear order</button>
      <p id="orderMsg" class="msg" role="status"></p>
    </section>

    <!-- 3. TODAY: totals, orders in progress, recent orders -->
    <section class="panel side-panel">
      <h2>Today</h2>
      <div id="stats" class="stats"></div>

      <h2>In progress</h2>
      <ul id="activeList" class="order-list"></ul>

      <h2>Recent orders</h2>
      <ul id="recentList" class="order-list"></ul>
    </section>

  </main>

  <script type="module" src="js/cashier.js"></script>
</body>
</html>
