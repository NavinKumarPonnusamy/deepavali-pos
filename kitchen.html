<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("cupcha-theme")||"light"}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen · Cupcha</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/v2.css">
</head>
<body>
  <header class="topbar">
    <strong class="brand">Cupcha · Kitchen</strong>
    <span class="topbar-right">
      <button id="themeBtn" class="btn ghost small theme-btn" type="button">Dark mode</button>
      <span id="who" class="muted"></span>
      <button id="logoutBtn" class="btn ghost small" type="button">Sign out</button>
    </span>
  </header>

  <div id="login"></div>

  <main id="app" class="kitchen" hidden>
    <nav class="k-tabs" role="tablist" aria-label="Station">
      <button class="k-tab" role="tab" type="button" data-st="drinks">Drinks <span class="count" id="cnt-drinks"></span></button>
      <button class="k-tab" role="tab" type="button" data-st="snacks">Snacks <span class="count" id="cnt-snacks"></span></button>
    </nav>

    <div class="k-bar">
      <button id="soundBtn" class="btn small" type="button">Turn on sound</button>
      <span id="kMsg" class="muted" role="status"></span>
    </div>

    <ul id="kList" class="k-list"></ul>

    <details class="panel k-done">
      <summary>Just finished <span class="muted">(tap Undo if it was a mistake)</span></summary>
      <ul id="kDone" class="order-list"></ul>
    </details>
  </main>

  <script type="module" src="js/v2/kitchen.js"></script>
  <script type="module" src="js/v2/theme.js"></script>
</body>
</html>
